name: Build and Publish .NET App

on:
  push:
    branches: [ "master" ] # Triggers the workflow on pushes to the main branch
    tags: 
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0' # Change this to match your target .NET version

    - name: Publish Single EXE
      run: |
        dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o ./publish

    # Zips the published directory so users get a clean download package
    - name: Zip Output
      run: |
        cd publish
        zip -r ../my-app-windows.zip .
        cd ..

    # Creates the GitHub Release and attaches the ZIP file containing your .exe
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: my-app-windows.zip
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref }}
        draft: false
        prerelease: false